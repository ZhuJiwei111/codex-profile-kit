interface:
  display_name: "Supervise Long Jobs"
  short_description: "Persistent terminal and health event supervision"
  default_prompt: "Use $supervise-long-jobs to discover capabilities, declare an observation contract, and supervise this authorized long command without model polling."
dependencies:
  tools:
    - type: "mcp"
      value: "long_job_supervisor"
      description: "Discover capabilities and wait for bounded durable job events"
policy:
  allow_implicit_invocation: true
